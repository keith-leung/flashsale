events {
    worker_connections 4096;
}

http {
    # Upstream backend pool - round-robin load balancing
    # Using static IPs (actual container IPs) - Variant A network (10.90.0.x)
    upstream flash_sale_backend {
        server 10.90.0.4:8000 max_fails=3 fail_timeout=30s;  # python-service
        server 10.90.0.5:8080 max_fails=3 fail_timeout=30s;  # java-service
        server 10.90.0.6:80 max_fails=3 fail_timeout=30s;    # csharp-service
    }

    # Individual service upstreams for direct routing
    upstream python_backend {
        server 10.90.0.4:8000;
    }

    upstream java_backend {
        server 10.90.0.5:8080;
    }

    upstream csharp_backend {
        server 10.90.0.6:80;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/ssl/nginx/nginx.crt;
        ssl_certificate_key /etc/ssl/nginx/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Individual service routes
        location /python/ {
            proxy_pass http://python_backend/;
        }

        location /java/ {
            proxy_pass http://java_backend/;
        }

        location /csharp/ {
            proxy_pass http://csharp_backend/;
        }

        # Load balancer endpoint (round-robin across all services)
        location / {
            proxy_pass http://flash_sale_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }
    }
}
