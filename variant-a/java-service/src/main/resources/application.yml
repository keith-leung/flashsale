spring:
  application:
    name: flashsale-service
  # Enable virtual threads for Tomcat (Java 21+)
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/orange315?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: syracuse
    password: Orange_315_Forever!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

  data:
    redis:
      host: 127.0.0.1
      port: 6380
      timeout: 2000ms
      lettuce:
        pool:
          # Dramatically increase pool size for high throughput with Virtual Threads
          max-active: 500        # Max connections (was default 8)
          max-idle: 100          # Max idle connections
          min-idle: 50           # Min idle connections (pre-warmed)
          max-wait: 100ms        # Max wait for connection

  cache:
    type: redis
    redis:
      time-to-live: 600000

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  tomcat:
    threads:
      max: 1000            # Increase from default 200
      min-spare: 100       # Pre-warmed threads
    max-connections: 10000 # Max concurrent connections
    accept-count: 1000     # Queue size when all threads busy

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.flashsale.api: WARN           # Reduce logging in hot path
    com.flashsale.api.service: WARN   # Suppress order logs
    org.springframework.cache: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
