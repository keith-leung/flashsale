events {
    worker_connections 4096;
}

http {
    # DNS resolver for Docker (use Docker's internal DNS)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Upstream backend pool - round-robin load balancing
    upstream flash_sale_backend {
        server python-service:8000 max_fails=3 fail_timeout=30s;
        server java-service:8080 max_fails=3 fail_timeout=30s;
        server csharp-service:80 max_fails=3 fail_timeout=30s;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/ssl/nginx/nginx.crt;
        ssl_certificate_key /etc/ssl/nginx/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Load balancer endpoint
        location / {
            proxy_pass http://flash_sale_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }
    }
}
