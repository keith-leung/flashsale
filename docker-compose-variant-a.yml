# =============================================================================
# Docker Compose - Variant A (2015 Golden Solution)
# Services: MariaDB + Nginx + Redis + Kafka
# =============================================================================
#
# MIGRATION INSTRUCTIONS:
# -----------------------
# Migrate existing MariaDB 3306 â→ 3307:
# 1. mysqldump -h 127.0.0.1 -P 3306 -u syracuse -p orange315 > /tmp/backup.sql
# 2. docker-compose -f docker-compose-variant-a.yml up -d mariadb
# 3. mysql -h 127.0.0.1 -P 3307 -u syracuse -p orange315 < /tmp/backup.sql
# 4. Verify: mysql -h 127.0.0.1 -P 3307 -u syracuse -p -e "SHOW DATABASES;"
#
# SSL CERTIFICATE GENERATION:
# ---------------------------
# Generate self-signed SSL certificate:
# mkdir -p ./ssl
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout ./ssl/nginx.key -out ./ssl/nginx.crt \
#   -subj "/C=US/ST=NY/L=Syracuse/O=FlashSale/CN=localhost"
#
# NETWORK VALIDATION:
# -------------------
# Test internal network connectivity:
# docker exec <app-container> ping mariadb
# docker exec <app-container> ping redis
# docker exec <app-container> nc -zv mariadb 3306
#
# PORT SUMMARY TABLE:
# -------------------
# Port Mapping:
# Host â→ Container
# 3306 â→ (reserved for existing WSL MariaDB)
# 3307 â→ mariadb:3306 (new podman instance)
# 8443 â→ nginx:443 (HTTPS)
# 6380 â→ redis:6379 (debug only, optional)
# 9092 â→ kafka:9092 (debug only, optional)
#
# Internal network communication uses service names:
# - mariadb:3306 (from app containers)
# - redis:6379 (from app containers)
# - kafka:9092 (from app containers)

services:
  # ---------------------------------------------------------------------------
  # PERMANENT INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: flash-mariadb
    restart: always
    cpuset: "0-7"
    cpus: "8.0"
    mem_limit: 16G
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orange315
      MYSQL_USER: syracuse
      MYSQL_PASSWORD: Orange_315_Forever!
    command: --innodb-buffer-pool-size=13G --max-connections=3000 --innodb-flush-log-at-trx-commit=2
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - flash-benchmark-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: flash-nginx
    restart: always
    cpuset: "8-23"
    cpus: "1.0"
    mem_limit: 512M
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/nginx:ro
    networks:
      - flash-benchmark-net
    depends_on:
      - mariadb

  # ---------------------------------------------------------------------------
  # VARIANT A SPECIFIC SERVICES
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: flash-redis
    restart: unless-stopped
    cpuset: "8-23"
    cpus: "4.0"
    mem_limit: 4G
    ports:
      - "6380:6379" # External debugging only
    volumes:
      - redis_data:/data
    networks:
      - flash-benchmark-net

  kafka:
    image: bitnami/kafka:latest
    container_name: flash-kafka
    restart: unless-stopped
    cpuset: "8-23"
    cpus: "3.0"
    mem_limit: 3G
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Cluster ID
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      -kafka_data:/bitnami/kafka
    networks:
      - flash-benchmark-net

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  flash-benchmark-net:
    driver: bridge
