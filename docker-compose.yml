# =============================================================================
# Flash Sale Microservices Platform - Baseline Configuration
# Services: MariaDB + Redis + Nginx + Python + Java + C#
# =============================================================================
#
# ARCHITECTURE: One Variant Per WSL Instance
# -------------------------------------------
# Due to Podman 3.4.4 limitations with static IP allocation, each architectural
# variant runs in a dedicated WSL instance for clean isolation and fair comparison.
#
# This instance: Baseline variant (standard database-heavy architecture)
# Duplicate this WSL for other variants (e.g., Redis-optimized, read replicas)
#
# CPU CORE ALLOCATION STRATEGY (Intel Core Ultra 9 275HX - 24 cores):
# ---------------------------------------------------------------------
# Hardware: 8 P-cores (0-7) + 16 E-cores (8-23)
#
# P-CORES (0-7) - Middleware (8 cores):
#   - MariaDB: CPUs 0-7 (8 cores, 16GB RAM)
#   - Redis:   CPUs 0-7 (2 cores limit, 2GB RAM)
#   - Nginx:   CPUs 0-7 (1 core limit, 512MB RAM)
#
# E-CORES (8-23) - Applications (16 cores):
#   - Python Service:  CPUs 8-23 (4 cores limit, 4GB RAM)
#   - Java Service:    CPUs 8-23 (4 cores limit, 4GB RAM)
#   - C# Service:      CPUs 8-23 (4 cores limit, 4GB RAM)
#
# Rationale:
#   - Middleware (DB, Cache, LB) gets P-cores for maximum I/O throughput
#   - Applications get E-cores (sufficient for I/O-bound workloads)
#   - Fair comparison: each variant gets dedicated WSL with same resources
#   - No port conflicts: all variants use standard ports (8000, 8080, 8082)
# 3. mysql -h 127.0.0.1 -P 3307 -u syracuse -p orange315 < /tmp/backup.sql
# 4. Verify: mysql -h 127.0.0.1 -P 3307 -u syracuse -p -e "SHOW DATABASES;"
#
# SSL CERTIFICATE GENERATION:
# ---------------------------
# Generate self-signed SSL certificate:
# mkdir -p ./ssl
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout ./ssl/nginx.key -out ./ssl/nginx.crt \
#   -subj "/C=US/ST=NY/L=Syracuse/O=FlashSale/CN=localhost"
#
# NETWORK VALIDATION:
# -------------------
# Test internal network connectivity:
# docker exec <app-container> ping mariadb
# docker exec <app-container> nc -zv mariadb 3306
#
# PORT SUMMARY TABLE:
# -------------------
# Port Mapping:
# Host → Container
# 3306 → (reserved for existing WSL MariaDB)
# 3307 → mariadb:3306 (new podman instance)
# 6380 → redis:6379
# 8000 → python-service:8000
# 8081 → java-service:8080
# 8082 → csharp-service:80
# 8443 → nginx:443 (HTTPS)
#
# Internal network communication uses service names:
# - mariadb:3306 (from app containers)
# - redis:6379 (from app containers)

services:
  # ---------------------------------------------------------------------------
  # PERMANENT INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: flash-mariadb
    restart: always
    cpuset: "0-7"  # P-cores for middleware (8 P-cores: 0-7)
    cpus: "8.0"
    mem_limit: 16G
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orange315
      MYSQL_USER: syracuse
      MYSQL_PASSWORD: Orange_315_Forever!
    command: --innodb-buffer-pool-size=13G --max-connections=3000 --innodb-flush-log-at-trx-commit=2
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: flash-nginx
    restart: always
    cpuset: "0-7"  # P-cores for middleware
    cpus: "1.0"
    mem_limit: 512M
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/nginx:ro
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.4
    depends_on:
      - mariadb
      - python-service
      - java-service
      - csharp-service

  # ---------------------------------------------------------------------------
  # CACHE LAYER
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: flash-redis
    restart: unless-stopped
    cpuset: "0-7"  # P-cores for middleware
    cpus: "2.0"
    mem_limit: 2G
    # No external port mapping - only accessible internally
    volumes:
      - redis_data:/data
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # APPLICATION SERVICES
  # ---------------------------------------------------------------------------
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: flash-python
    restart: unless-stopped
    cpuset: "8-23"  # E-cores for applications (16 E-cores: 8-23)
    cpus: "4.0"
    mem_limit: 4G
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://syracuse:Orange_315_Forever!@10.88.0.2:3306/orange315
      REDIS_URL: redis://10.88.0.3:6379/0
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.5
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: flash-java
    restart: unless-stopped
    cpuset: "8-23"  # E-cores for applications (16 E-cores: 8-23)
    cpus: "4.0"
    mem_limit: 4G
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://10.88.0.2:3306/orange315?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: syracuse
      SPRING_DATASOURCE_PASSWORD: Orange_315_Forever!
      SPRING_DATA_REDIS_HOST: 10.88.0.3
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.6
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  csharp-service:
    build:
      context: ./csharp-service
      dockerfile: Dockerfile
    container_name: flash-csharp
    restart: unless-stopped
    cpuset: "8-23"  # E-cores for applications (16 E-cores: 8-23)
    cpus: "4.0"
    mem_limit: 4G
    ports:
      - "8082:80"
    environment:
      ConnectionStrings__DefaultConnection: "Server=10.88.0.2;Port=3306;Database=orange315;User=syracuse;Password=Orange_315_Forever!;"
      ConnectionStrings__Redis: "10.88.0.3:6379"
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      flash-benchmark-net:
        ipv4_address: 10.88.0.7
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  flash-benchmark-net:
    name: podman
    external: true
